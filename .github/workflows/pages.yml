name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: python -c 'import json,os,pathlib; pathlib.Path("web/config.js").write_text("window.UMA_CONFIG = { API_BASE_URL: " + json.dumps(os.environ.get("API_BASE_URL", "")) + " };\n")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: web}
      - id: deployment
        uses: actions/deploy-pages@v4
