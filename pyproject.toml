[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-predictor"
version = "0.1.0"
description = "Leak-safe horse race probability API and GitHub Pages frontend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
scrape = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
]
dev = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "pandas>=2.2,<4",
  "pytest>=8,<9",
  "requests>=2.32,<3",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["uma_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

