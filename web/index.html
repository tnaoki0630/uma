<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d24">
  <title>UMA Lens — 競馬確率予測</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div><p class="eyebrow">RACE PROBABILITY LAB</p><h1>UMA <span>Lens</span></h1></div>
    <span class="status" id="status">デモモード</span>
  </header>
  <main>
    <section class="race-card">
      <div><p class="label">予測基準</p><select id="basisSelect" aria-label="予測基準"><option value="horse">馬基準</option><option value="jockey">ジョッキー基準</option></select></div>
      <div><p class="label">検証レース数</p><input id="validationCount" type="number" min="1" value="3" aria-label="検証レース数"></div>
      <div class="race-picker"><p class="label">検証レース</p><select id="raceSelect" aria-label="レース選択"></select></div>
      <div class="conditions" id="conditions"></div>
      <button id="predictButton">確率を計算</button>
    </section>
    <section class="entry-card" aria-labelledby="entryTitle">
      <div class="section-heading">
        <div><p class="label">RACE ENTRIES</p><h2 id="entryTitle">出馬表</h2></div>
        <div class="entry-actions"><span id="entryCount"></span><button id="entryToggle" type="button" aria-expanded="true" aria-controls="entryList">閉じる</button></div>
      </div>
      <div id="entryList" class="entry-list"></div>
    </section>
    <section class="metrics" id="metrics" aria-live="polite"></section>
    <section class="summary"><p class="label">モデルの見方</p><p id="modelCopy">レース条件の基準速度に、各馬の過去走から推定した残差を重ねています。帯は予測の不確実性です。</p></section>
    <nav class="tabs" aria-label="券種"><button class="active" data-tab="win">単勝</button><button data-tab="trio">三連複</button><button data-tab="trifecta">三連単</button></nav>
    <section id="results" aria-live="polite"><div class="empty">「確率を計算」を押してください</div></section>
    <section id="warnings" class="warnings"></section>
  </main>
  <footer>研究・娯楽用途の予測です。投票判断はご自身の責任で行ってください。</footer>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
